[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "scholar-graph-kit"
version = "0.1.0"
description = "Build and visualize citation graphs from scholar search results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "pyvis>=0.3.2",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    # E3/T-110b source decoupling: the relative editable
    # `[tool.uv.sources] scholar-search-kit = { path = "../scholar-search-kit" }`
    # entry only resolves inside the Nexus Scholar monorepo. For a standalone
    # `uv pip install scholar-graph-kit` the wheel METADATA carried no reference
    # at all, so the runtime sibling requirement could not be resolved outside the
    # monorepo (and the relative path is unresolvable for a git checkout of this
    # kit alone). The sibling is therefore declared as a PEP 508 direct git
    # reference pinned to the canonical scholar-search-kit main commit, which is
    # the standalone carrier, exactly like the T-110 declared-dependency
    # pattern. `[tool.uv.sources]` is removed entirely.
    "scholar-search-kit @ git+https://github.com/nexus-scholar-org/scholar-search-kit@911d864fcb6a706d4c0339f80524a46f591e2cad",
]

[project.scripts]
scholar-graph = "scholar_graph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_graph"]

# A `project.dependencies` entry that is a PEP 508 direct reference (the
# scholar-search-kit git pin above) is only accepted by hatchling when the
# backend is explicitly opted in. This mirrors the same opt-in already present
# in the sibling Nexus Scholar kits (scholar-bib-kit, scholar-pdf-kit,
# scholar-rag-kit, scholar-agent-kit).
#
# Consequence, deliberate: the resulting wheel is NOT uploadable to PyPI
# (PEP 508 direct references are forbidden by the index). These kits are
# distributed from their canonical git repositories, and every consumer pins a
# full commit SHA, so a git-only distribution model is intended, not a
# limitation.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
