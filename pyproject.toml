[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "scholar-graph-kit"
version = "0.1.0"
description = "Build and visualize citation graphs from scholar search results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "pyvis>=0.3.2",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "scholar-search-kit",
]

[project.scripts]
scholar-graph = "scholar_graph.cli:app"

[tool.uv.sources]
scholar-search-kit = { path = "../scholar-search-kit", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_graph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
